spring.application.name=Passenger Van Rental System
# Local development uses H2 by default. Render environment variables override these values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/vanrental;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
server.port=${PORT:8080}
